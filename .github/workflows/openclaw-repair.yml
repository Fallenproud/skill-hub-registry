name: OpenClaw import repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/openclaw-repair.yml

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply transport-safe OpenClaw repair
        run: python scripts/.openclaw-ci-repair.py
      - name: Run full registry release gate
        run: npm run check
      - name: Build onboarding site
        run: npm run site:build
      - name: Remove temporary repair machinery
        run: rm -f scripts/.openclaw-ci-repair.py .github/workflows/openclaw-repair.yml
      - name: Commit verified repair
        run: |
          git config user.name "Fallenproud"
          git config user.email "mr.lyder@hotmail.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: validate OpenClaw inventory without binary source dependency"
          git push origin HEAD:main
