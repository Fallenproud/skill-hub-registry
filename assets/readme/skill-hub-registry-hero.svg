<svg xmlns="http://www.w3.org/2000/svg" width="7680" height="4320" viewBox="0 0 7680 4320">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05070a"/><stop offset="1" stop-color="#0b1218"/></linearGradient><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#65ff9c"/><stop offset="1" stop-color="#4fe4ff"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="20" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="160" height="160" patternUnits="userSpaceOnUse"><path d="M160 0H0V160" fill="none" stroke="#12202a" stroke-width="3"/></pattern></defs>
<style>.title{font-family:DejaVu Sans,Arial,sans-serif;font-weight:700;fill:#f3f6f8}.h2{font-family:DejaVu Sans,Arial,sans-serif;font-weight:650;fill:#f3f6f8}.body{font-family:DejaVu Sans,Arial,sans-serif;font-weight:400;fill:#c9d2dc}.muted{font-family:DejaVu Sans,Arial,sans-serif;font-weight:400;fill:#9ca9b6}.mono{font-family:DejaVu Sans Mono,monospace;fill:#f3f6f8}.green{fill:#65ff9c}.cyan{fill:#4fe4ff}.amber{fill:#ffcf66}.panel{fill:#10151b;stroke:#27323d;stroke-width:6}.panel2{fill:#151c24;stroke:#27323d;stroke-width:6}.line{stroke:#65ff9c;stroke-width:10;fill:none}.smallcaps{font-family:DejaVu Sans,Arial,sans-serif;font-weight:500;fill:#9ca9b6;letter-spacing:10px}</style>
<rect width="100%" height="100%" fill="url(#bg)"/><rect width="100%" height="100%" fill="url(#grid)" opacity=".35"/><circle cx="6500" cy="-300" r="2200" fill="#0a2319" opacity=".28"/><circle cx="6500" cy="-300" r="1700" fill="none" stroke="#245d43" stroke-width="8" opacity=".5"/><text x="320" y="300" class="smallcaps" font-size="76">SKILL HUB REGISTRY</text><rect x="320" y="420" width="110" height="16" rx="8" fill="url(#g)" filter="url(#glow)"/><text x="320" y="760" class="title" font-size="260">Skill Hub Registry</text><text x="330" y="980" class="body" font-size="108">A clear, versioned home for reusable AI skills — inspectable by people, reliable for runtimes.</text>
<rect x="320" y="1280" width="7040" height="2100" rx="72" class="panel"/><text x="650" y="1610" class="h2 green" font-size="126">Think of it as an app store for agent capabilities — with receipts.</text><text x="650" y="1825" class="body" font-size="86">A skill is not trusted because it exists. It must be defined, checked, and explicitly bound before execution.</text>
<rect x="650" y="2130" width="1380" height="760" rx="54" class="panel2"/><text x="760" y="2330" class="smallcaps" font-size="56">01 • DISCOVER</text><text x="760" y="2550" class="h2" font-size="112">Find a skill</text><text x="760" y="2730" class="body" font-size="72">Search lightweight metadata.</text><rect x="2150" y="2130" width="1380" height="760" rx="54" class="panel2"/><text x="2260" y="2330" class="smallcaps" font-size="56">02 • INSPECT</text><text x="2260" y="2550" class="h2" font-size="112">Read its contract</text><text x="2260" y="2730" class="body" font-size="72">See inputs, outputs, boundaries.</text><rect x="3650" y="2130" width="1380" height="760" rx="54" class="panel2"/><text x="3760" y="2330" class="smallcaps" font-size="56">03 • QUALIFY</text><text x="3760" y="2550" class="h2" font-size="112">Check evidence</text><text x="3760" y="2730" class="body" font-size="72">Compatibility and runtime proof.</text><rect x="5150" y="2130" width="1380" height="760" rx="54" class="panel2"/><text x="5260" y="2330" class="smallcaps" font-size="56">04 • EXECUTE</text><text x="5260" y="2550" class="h2" font-size="112">Bind deliberately</text><text x="5260" y="2730" class="body" font-size="72">Execution only when verified.</text><text x="650" y="3170" class="body" font-size="78">Git defines what a native skill is. Runtime systems decide what happens when it runs.</text>
<line x1="320" y1="3960" x2="7360" y2="3960" stroke="#27323d" stroke-width="6"/><text x="320" y="4100" class="body" font-size="72">Created by Fallenproud</text><text x="6100" y="4100" text-anchor="end" class="muted" font-size="64">Canonical skill definitions • evidence before execution</text></svg>