0" class="smallcaps" font-size="48">01</text><text x="430" y="1960" class="h2 green" font-size="94">Search</text><text x="430" y="2180" class="body" font-size="66">Find reusable work</text><path d="M1170 2170 H1230" class="line"/><polygon points="1230,2170 1160,2125 1160,2215" fill="#65ff9c"/><rect x="1240" y="1530" width="820" height="1280" rx="54" class="panel"/><text x="1330" y="1720" class="smallcaps" font-size="48">02</text><text x="1330" y="1960" class="h2 green" font-size="94">Preserve</text><text x="1330" y="2180" class="body" font-size="66">Keep provenance</text><path d="M2070 2170 H2130" class="line"/><polygon points="2130,2170 2060,2125 2060,2215" fill="#65ff9c"/><rect x="2140" y="1530" width="820" height="1280" rx="54" class="panel"/><text x="2230" y="1720" class="smallcaps" font-size="48">03</text><text x="2230" y="1960" class="h2 green" font-size="94">Separate</text><text x="2230" y="2180" class="body" font-size="66">Remove project specifics</text><path d="M2970 2170 H3030" class="line"/><polygon points="3030,2170 2960,2125 2960,2215" fill="#65ff9c"/><rect x="3040" y="1530" width="820" height="1280" rx="54" class="panel"/><text x="3130" y="1720" class="smallcaps" font-size="48">04</text><text x="3130" y="1960" class="h2 green" font-size="94">Qualify</text><text x="3130" y="2180" class="body" font-size="66">Check evidence + risk</text><path d="M3870 2170 H3930" class="line"/><polygon points="3930,2170 3860,2125 3860,2215" fill="#65ff9c"/><rect x="3940" y="1530" width="820" height="1280" rx="54" class="panel"/><text x="4030" y="1720" class="smallcaps" font-size="48">05</text><text x="4030" y="1960" class="h2 green" font-size="94">Package</text><text x="4030" y="2180" class="body" font-size="66">Write skill + contract</text><path d="M4770 2170 H4830" class="line"/><polygon points="4830,2170 4760,2125 4760,2215" fill="#65ff9c"/><rect x="4840" y="1530" width="820" height="1280" rx="54" class="panel"/><text x="4930" y="1720" class="smallcaps" font-size="48">