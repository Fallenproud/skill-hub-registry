<svg xmlns="http://www.w3.org/2000/svg" width="7680" height="4320" viewBox="0 0 7680 4320"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05070a"/><stop offset="1" stop-color="#0b1218"/></linearGradient><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#65ff9c"/><stop offset="1" stop-color="#4fe4ff"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="20" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="160" height="160" patternUnits="userSpaceOnUse"><path d="M160 0H0V160" fill="none" stroke="#12202a" stroke-width="3"/></pattern></defs><style>.title{font-family:DejaVu Sans,Arial,sans-serif;font-weight:700;fill:#f3f6f8}.h2{font-family:DejaVu Sans,Arial,sans-serif;font-weight:650;fill:#f3f6f8}.body{font-family:DejaVu Sans,Arial,sans-serif;font-weight:400;fill:#c9d2dc}.muted{font-family:DejaVu Sans,Arial,sans-serif;font-weight:400;fill:#9ca9b6}.mono{font-family:DejaVu Sans Mono,monospace;fill:#f3f6f8}.green{fill:#65ff9c}.cyan{fill:#4fe4ff}.panel{fill:#10151b;stroke:#27323d;stroke-width:6}.smallcaps{font-family:DejaVu Sans,Arial,sans-serif;font-weight:500;fill:#9ca9b6;letter-spacing:10px}</style><rect width="100%" height="100%" fill="url(#bg)"/><rect width="100%" height="100%" fill="url(#grid)" opacity=".35"/><circle cx="6500" cy="-300" r="2200" fill="#0a2319" opacity=".28"/><circle cx="6500" cy="-300" r="1700" fill="none" stroke="#245d43" stroke-width="8" opacity=".5"/><text x="320" y="300" class="smallcaps" font-size="76">SKILL HUB REGISTRY</text><rect x="320" y="420" width="110" height="16" rx="8" fill="url(#g)" filter="url(#glow)"/><text x="320" y="760" class="title" font-size="260">How to use this repository</text><text x="330" y="980" class="body" font-size="108">You do not need to understand the migration internals to use Skill Hub Registry safely.</text><rect x="420" y="1320" width="6840" height="2180" rx="72" class="panel"/><text x="650" y="1590" class="h2 green" font-size="118">If you just want to find and understand a skill:</text><text x="720" y="1840" class="body" font-size="82">1. Open <tspan class="mono">generated/registry.index.json</tspan> or the GitHub Pages registry.</text><text x="720" y="2050" class="body" font-size="82">2. Search by name, category, or description.</text><text x="720" y="2260" class="body" font-size="82">3. Open the matching <tspan class="mono">skills/&lt;category&gt;/&lt;slug&gt;/SKILL.md</tspan>.</text><text x="720" y="2470" class="body" font-size="82">4. Check <tspan class="mono">skill.json</tspan> for inputs, outputs, execution kind, and compatibility.</text><text x="720" y="2680" class="body" font-size="82">5. If it says adapter/executable, still verify the runtime binding before using it.</text><text x="650" y="3030" class="h2 cyan" font-size="104">If you want to add a skill:</text><text x="720" y="3230" class="body" font-size="76">Search for duplicates → preserve provenance → isolate project details → define boundaries → run <tspan class="mono">npm run check</tspan>.</text><line x1="320" y1="3960" x2="7360" y2="3960" stroke="#27323d" stroke-width="6"/><text x="320" y="4100" class="body" font-size="72">Created by Fallenproud</text><text x="6100" y="4100" text-anchor="end" class="muted" font-size="64">Canonical skill definitions • evidence before execution</text></svg>