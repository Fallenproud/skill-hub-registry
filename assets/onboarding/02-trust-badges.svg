<svg xmlns="http://www.w3.org/2000/svg" width="7680" height="4320" viewBox="0 0 7680 4320"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05070a"/><stop offset="1" stop-color="#0b1218"/></linearGradient><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#65ff9c"/><stop offset="1" stop-color="#4fe4ff"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="20" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="160" height="160" patternUnits="userSpaceOnUse"><path d="M160 0H0V160" fill="none" stroke="#12202a" stroke-width="3"/></pattern></defs><style>.title{font-family:DejaVu Sans,Arial,sans-serif;font-weight:700;fill:#f3f6f8}.h2{font-family:DejaVu Sans,Arial,sans-serif;font-weight:650;fill:#f3f6f8}.body{font-family:DejaVu Sans,Arial,sans-serif;font-weight:400;fill:#c9d2dc}.muted{font-family:DejaVu Sans,Arial,sans-serif;font-weight:400;fill:#9ca9b6}.green{fill:#65ff9c}.cyan{fill:#4fe4ff}.amber{fill:#ffcf66}.panel{fill:#10151b;stroke:#27323d;stroke-width:6}.smallcaps{font-family:DejaVu Sans,Arial,sans-serif;font-weight:500;fill:#9ca9b6;letter-spacing:10px}</style><rect width="100%" height="100%" fill="url(#bg)"/><rect width="100%" height="100%" fill="url(#grid)" opacity=".35"/><circle cx="6500" cy="-300" r="2200" fill="#0a2319" opacity=".28"/><circle cx="6500" cy="-300" r="1700" fill="none" stroke="#245d43" stroke-width="8" opacity=".5"/><text x="320" y="300" class="smallcaps" font-size="76">SKILL HUB REGISTRY</text><rect x="320" y="420" width="110" height="16" rx="8" fill="url(#g)" filter="url(#glow)"/><text x="320" y="760" class="title" font-size="260">What the status words actually mean</text><text x="330" y="980" class="body" font-size="108">Plain-language guide to the labels you will see throughout the registry.</text><rect x="420" y="1320" width="2130" height="1780" rx="66" class="panel"/><text x="610" y="1600" class="h2 green" font-size="130">Definition exists</text><text x="610" y="1810" class="body" font-size="80">The skill has files and a contract.</text><text x="610" y="2040" class="h2" font-size="94">This does NOT mean:</text><text x="610" y="2240" class="body" font-size="76">• installed</text><text x="610" y="2400" class="body" font-size="76">• trusted</text><text x="610" y="2560" class="body" font-size="76">• compatible</text><text x="610" y="2720" class="body" font-size="76">• executable</text><rect x="2775" y="1320" width="2130" height="1780" rx="66" class="panel"/><text x="2965" y="1600" class="h2 cyan" font-size="130">Validated</text><text x="2965" y="1810" class="body" font-size="80">Structure and rules pass checks.</text><text x="2965" y="2040" class="h2" font-size="94">Still ask:</text><text x="2965" y="2240" class="body" font-size="76">• Is there runtime evidence?</text><text x="2965" y="2400" class="body" font-size="76">• Are dependencies available?</text><text x="2965" y="2560" class="body" font-size="76">• Is the binding verified?</text><rect x="5130" y="1320" width="2130" height="1780" rx="66" class="panel"/><text x="5320" y="1600" class="h2 amber" font-size="130">Executable</text><text x="5320" y="1810" class="body" font-size="80">A verified runtime binding exists.</text><text x="5320" y="2040" class="h2" font-size="94">Execution still obeys:</text><text x="5320" y="2240" class="body" font-size="76">• permissions</text><text x="5320" y="2400" class="body" font-size="76">• policy</text><text x="5320" y="2560" class="body" font-size="76">• approvals</text><text x="5320" y="2720" class="body" font-size="76">• consumer compatibility</text><rect x="1500" y="3290" width="4680" height="430" rx="215" fill="#0c2018" stroke="#2d6a4f" stroke-width="6"/><text x="3840" y="3560" text-anchor="middle" class="h2" font-size="104">Discovery is not permission. Evidence comes before execution.</text><line x1="320" y1="3960" x2="7360" y2="3960" stroke="#27323d" stroke-width="6"/><text x="320" y="4100" class="body" font-size="72">Created by Fallenproud</text><text x="6100" y="4100" text-anchor="end" class="muted" font-size="64">Canonical skill definitions • evidence before execution</text></svg>