<svg xmlns="http://www.w3.org/2000/svg" width="7680" height="4320" viewBox="0 0 7680 4320"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05070a"/><stop offset="1" stop-color="#0b1218"/></linearGradient><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#65ff9c"/><stop offset="1" stop-color="#4fe4ff"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="20" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="160" height="160" patternUnits="userSpaceOnUse"><path d="M160 0H0V160" fill="none" stroke="#12202a" stroke-width="3"/></pattern></defs><style>.title{font-family:DejaVu Sans,Arial,sans-serif;font-weight:700;fill:#f3f6f8}.h2{font-family:DejaVu Sans,Arial,sans-serif;font-weight:650;fill:#f3f6f8}.body{font-family:DejaVu Sans,Arial,sans-serif;font-weight:400;fill:#c9d2dc}.muted{font-family:DejaVu Sans,Arial,sans-serif;font-weight:400;fill:#9ca9b6}.mono{font-family:DejaVu Sans Mono,monospace;fill:#f3f6f8}.green{fill:#65ff9c}.cyan{fill:#4fe4ff}.panel{fill:#10151b;stroke:#27323d;stroke-width:6}.line{stroke:#65ff9c;stroke-width:10;fill:none}.smallcaps{font-family:DejaVu Sans,Arial,sans-serif;font-weight:500;fill:#9ca9b6;letter-spacing:10px}</style><rect width="100%" height="100%" fill="url(#bg)"/><rect width="100%" height="100%" fill="url(#grid)" opacity=".35"/><circle cx="6500" cy="-300" r="2200" fill="#0a2319" opacity=".28"/><circle cx="6500" cy="-300" r="1700" fill="none" stroke="#245d43" stroke-width="8" opacity=".5"/><text x="320" y="300" class="smallcaps" font-size="76">SKILL HUB REGISTRY</text><rect x="320" y="420" width="110" height="16" rx="8" fill="url(#g)" filter="url(#glow)"/><text x="320" y="760" class="title" font-size="260">The registry in one picture</text><text x="330" y="980" class="body" font-size="108">Native skills stay small and portable. Everything else stays separated until it earns promotion.</text><rect x="520" y="1330" width="1840" height="2050" rx="72" class="panel"/><text x="700" y="1600" class="smallcaps" font-size="58">SOURCE</text><text x="700" y="1820" class="h2 green" font-size="120">skills/</text><text x="700" y="2050" class="body" font-size="78">Canonical native packages only</text><text x="700" y="2340" class="mono" font-size="70">SKILL.md</text><text x="700" y="2500" class="mono" font-size="70">skill.json</text><path d="M2360 2350 H3020" class="line"/><polygon points="3020,2350 2935,2300 2935,2400" fill="#65ff9c"/><rect x="3020" y="1500" width="1640" height="1700" rx="90" fill="#0c2018" stroke="#3d9b6e" stroke-width="10"/><text x="3840" y="1900" text-anchor="middle" class="smallcaps" font-size="62">DETERMINISTIC COMPILER</text><text x="3840" y="2200" text-anchor="middle" class="title green" font-size="150">Registry Core</text><text x="3840" y="2430" text-anchor="middle" class="body" font-size="76">validate • sort • resolve</text><text x="3840" y="2610" text-anchor="middle" class="body" font-size="76">hash • compile • index</text><text x="3840" y="2930" text-anchor="middle" class="mono" font-size="62">generated/registry.index.json</text><path d="M4660 2350 H5320" class="line"/><polygon points="5320,2350 5235,2300 5235,2400" fill="#65ff9c"/><rect x="5320" y="1330" width="1840" height="2050" rx="72" class="panel"/><text x="5500" y="1600" class="smallcaps" font-size="58">CONSUMERS</text><text x="5500" y="1820" class="h2 cyan" font-size="120">Discover first</text><text x="5500" y="2050" class="body" font-size="78">Hydrate a selected skill only when needed.</text><text x="5500" y="2380" class="body" font-size="76">• agents</text><text x="5500" y="2540" class="body" font-size="76">• MCP / HTTP adapters</text><text x="5500" y="2700" class="body" font-size="76">• CLIs</text><text x="5500" y="2860" class="body" font-size="76">• external registries</text><text x="3840" y="3590" text-anchor="middle" class="h2" font-size="96">inventory/ and candidates/ never enter the native compiler automatically.</text><line x1="320" y1="3960" x2="7360" y2="3960" stroke="#27323d" stroke-width="6"/><text x="320" y="4100" class="body" font-size="72">Created by Fallenproud</text><text x="6100" y="4100" text-anchor="end" class="muted" font-size="64">Canonical skill definitions • evidence before execution</text></svg>