<svg xmlns="http://www.w3.org/2000/svg" width="7680" height="4320" viewBox="0 0 7680 4320"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05070a"/><stop offset="1" stop-color="#0b1218"/></linearGradient><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#65ff9c"/><stop offset="1" stop-color="#4fe4ff"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="20" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="160" height="160" patternUnits="userSpaceOnUse"><path d="M160 0H0V160" fill="none" stroke="#12202a" stroke-width="3"/></pattern></defs><style>.title{font-family:DejaVu Sans,Arial,sans-serif;font-weight:700;fill:#f3f6f8}.h2{font-family:DejaVu Sans,Arial,sans-serif;font-weight:650;fill:#f3f6f8}.body{font-family:DejaVu Sans,Arial,sans-serif;font-weight:400;fill:#c9d2dc}.muted{font-family:DejaVu Sans,Arial,sans-serif;font-weight:400;fill:#9ca9b6}.mono{font-family:DejaVu Sans Mono,monospace;fill:#f3f6f8}.green{fill:#65ff9c}.cyan{fill:#4fe4ff}.panel{fill:#10151b;stroke:#27323d;stroke-width:6}.panel2{fill:#151c24;stroke:#27323d;stroke-width:6}.line{stroke:#65ff9c;stroke-width:10;fill:none}.smallcaps{font-family:DejaVu Sans,Arial,sans-serif;font-weight:500;fill:#9ca9b6;letter-spacing:10px}</style><rect width="100%" height="100%" fill="url(#bg)"/><rect width="100%" height="100%" fill="url(#grid)" opacity=".35"/><circle cx="6500" cy="-300" r="2200" fill="#0a2319" opacity=".28"/><circle cx="6500" cy="-300" r="1700" fill="none" stroke="#245d43" stroke-width="8" opacity=".5"/><text x="320" y="300" class="smallcaps" font-size="76">SKILL HUB REGISTRY</text><rect x="320" y="420" width="110" height="16" rx="8" fill="url(#g)" filter="url(#glow)"/><text x="320" y="760" class="title" font-size="260">Inside a native skill package</text><text x="330" y="980" class="body" font-size="108">Two required files keep cognition readable and routing deterministic.</text><rect x="520" y="1300" width="6640" height="2230" rx="80" class="panel"/><rect x="760" y="1600" width="2670" height="1500" rx="60" class="panel2"/><text x="980" y="1880" class="mono green" font-size="128">SKILL.md</text><text x="980" y="2100" class="h2" font-size="96">Human + agent methodology</text><text x="980" y="2340" class="body" font-size="76">Explains the reusable reasoning:</text><text x="980" y="2530" class="body" font-size="70">• when to use it</text><text x="980" y="2690" class="body" font-size="70">• process and constraints</text><text x="980" y="2850" class="body" font-size="70">• quality gates and failure behavior</text><rect x="4250" y="1600" width="2670" height="1500" rx="60" class="panel2"/><text x="4470" y="1880" class="mono cyan" font-size="128">skill.json</text><text x="4470" y="2100" class="h2" font-size="96">Deterministic contract</text><text x="4470" y="2340" class="body" font-size="76">Tells runtimes what is explicit:</text><text x="4470" y="2530" class="body" font-size="70">• stable id, slug, version, category</text><text x="4470" y="2690" class="body" font-size="70">• inputs / outputs / boundaries</text><text x="4470" y="2850" class="body" font-size="70">• execution kind, policy, compatibility</text><path d="M3430 2350 H4250" class="line"/><text x="3840" y="2240" text-anchor="middle" class="smallcaps" font-size="50">TOGETHER</text><text x="3840" y="3390" text-anchor="middle" class="body" font-size="82">One explains the thinking. One makes the package machine-checkable.</text><line x1="320" y1="3960" x2="7360" y2="3960" stroke="#27323d" stroke-width="6"/><text x="320" y="4100" class="body" font-size="72">Created by Fallenproud</text><text x="6100" y="4100" text-anchor="end" class="muted" font-size="64">Canonical skill definitions • evidence before execution</text></svg>